name: Pruebas

# Corre las pruebas automáticas en cada push y en cada pull request. Las pruebas que usan la red real
# (marcadas «vivo») se omiten por defecto; para correrlas a mano:  pytest -m vivo
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Pruebas
        run: python -m pytest -q -p no:cacheprovider
